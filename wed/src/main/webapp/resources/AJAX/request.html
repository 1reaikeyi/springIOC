<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AJAX请求</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
<div id="app">
    <button @click="postMessage">获取post消息</button>
    <h1>{{message}}</h1>
</div>

<script>
    let object = {"username": "Tom","id": 101};
    Vue.createApp({
        data() {
            return {
                message: ''
            }
        },
        methods: {
            async postMessage() {
                    const jsonData = JSON.stringify(object);
                    // const response = await axios.post('/ajaxRequest', jsonData, {
                    const response = await axios.post('/ajaxResponse', jsonData, {

                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    this.message = response.data;
            }
        }
    }).mount('#app');

</script>
</body>
</html>
