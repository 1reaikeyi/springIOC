<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form th:action="@{/post}" method="post">
    用户：<input type="text" name="username" placeholder="name">
    <br>
    密码：<input type="password" name="password" placeholder="pass">
    <br>
    <button type="submit">登录</button>
</form>
<script>
    function sendCookie(){
        document.cookie = "id=001";
        document.cookie = "username=admin";
        document.location = "/post";
    }
</script>
<button onclick="sendCookie()">发送cookie</button>
</body>
</html>
